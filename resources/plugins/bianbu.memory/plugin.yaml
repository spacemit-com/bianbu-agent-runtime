schema_version: 1
name: bianbu.memory
version: 1.0.0
description: Agent memory tools, hooks, and guidance.
config_schema:
  type: object
  additionalProperties: false
  properties:
    socket_path: {type: [string, 'null'], minLength: 1}
    timeout_seconds: {type: number, exclusiveMinimum: 0, maximum: 30}
    # 1-100 stays accepted on purpose: the Memory SDK clamps the recall window to
    # 20 records, and this schema only validates. Narrowing the maximum would turn
    # that silent cap into a hard config error for an admin override that is
    # valid today, so the ceiling is documented in docs/memory-plugin.md instead.
    recall_top_k: {type: integer, minimum: 1, maximum: 100}
    recall_max_chars: {type: integer, minimum: 1, maximum: 100000}
    injection_guard: {type: boolean}
