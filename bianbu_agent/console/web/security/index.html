<script>
  // The security view is loaded as a separate document; mirror the Runtime
  // WebUI theme preference before the plugin paints.  Fall back to the
  // browser preference when the Runtime has not persisted a choice yet.
  (function () {
    var stored = localStorage.getItem('bianbu_theme');
    var dark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.classList.toggle('dark', dark);
  }());
  window.addEventListener('storage', function (event) {
    if (event.key !== 'bianbu_theme') return;
    document.documentElement.classList.toggle('dark', event.newValue === 'dark');
  });
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function (event) {
    if (!localStorage.getItem('bianbu_theme')) document.documentElement.classList.toggle('dark', event.matches);
  });
</script>
